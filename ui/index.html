<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desktop Notify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header id="titlebar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg> Notifications <span id="count" class="count"></span></span>
      <button id="hide" class="icon-button" title="Hide to tray (Esc)" aria-label="Hide to tray">−</button>
    </header>
    <nav id="view-controls" class="view-controls" aria-label="Filter and sort tasks" hidden>
      <div class="filters" role="group" aria-label="Show">
        <button id="filter-all" class="filter" type="button" data-filter="all" title="Every task">All</button>
        <button id="filter-attention" class="filter" type="button" data-filter="attention" title="Questions, finished and failed tasks you have not dismissed">Needs you</button>
        <button id="filter-asking" class="filter" type="button" data-filter="asking" title="Questions and permission requests, dismissed or not">Asking</button>
        <button id="filter-working" class="filter" type="button" data-filter="working" title="Agents busy on a task">Working</button>
        <button id="filter-done" class="filter" type="button" data-filter="done" title="Finished or failed tasks, seen or not">Done</button>
      </div>
      <div class="sort">
        <select id="sort-key" aria-label="Sort tasks">
          <option value="attention">Needs you first</option>
          <option value="working">Working first</option>
          <option value="updated">Last update</option>
          <option value="added">First seen</option>
        </select>
        <button id="sort-direction" class="sort-direction" type="button"></button>
      </div>
    </nav>
    <main>
      <p id="filtered-empty" class="filtered-empty" hidden><span id="filtered-empty-text"></span> <button id="filtered-reset" class="footer-link" type="button">Show all</button></p>
      <section id="notifications" aria-label="Agent statuses" aria-live="polite" hidden></section>
      <section id="empty" class="empty">
        <div class="empty-icon">✓</div>
        <h1>All caught up</h1>
        <p>Your agents’ next updates will appear here.</p>
      </section>
    </main>
    <div id="error" class="error" role="alert" hidden></div>
    <section id="sound-controls" class="sound-controls" aria-label="Sound for all agents" hidden>
      <div class="sound-buttons">
        <button id="silence-all" class="sound-button stop" type="button" title="Stop sound for every current entry; entries stay listed&#10;POST /sound/stop">Stop sound</button>
        <button id="snooze-1" class="sound-button" type="button" title="Mute all sound for 1 minute&#10;POST /sound/snooze {&quot;seconds&quot;: 60}">Snooze 1 min</button>
        <button id="snooze-5" class="sound-button" type="button" title="Mute all sound for 5 minutes&#10;POST /sound/snooze {&quot;seconds&quot;: 300}">Snooze 5 min</button>
      </div>
      <p id="sound-status" class="sound-status" role="status" aria-live="polite"></p>
    </section>
    <footer><span id="connection" class="connection">Connecting…</span><button id="api" class="footer-link" type="button" title="Web interface and REST API reference">Web API ↗</button><span class="footer-hint">Always on top · <kbd>esc</kbd> to hide</span></footer>
    <div id="resize" aria-hidden="true"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
