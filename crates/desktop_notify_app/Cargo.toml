[package]
name = "desktop-notify-app"
description = "A tray app for displaying and dismissing agent notifications"
edition.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png", "macos-private-api"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSResponder"] }
