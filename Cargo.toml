[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.0.1"
authors = ["Brandon Thomas <bt@brand.io>"]
publish = false

[workspace.dependencies]
actix-web = "4.13.0"
anyhow = "1.0.102"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
env_logger = "0.11.9"
log = "0.4.29"
rand = "0.9.1"
rodio = { version = "0.20.1", default-features = false, features = ["symphonia-all"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_yaml = "0.9.34"
tokio = { version = "1.50.0", features = ["macros"] }
toml = "0.9.12"

# `scripts/build.py` bundles the debug profile, and the tray bell's animation
# PNG-encodes its icon on every frame. Unoptimized, that costs about 20% of a core.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
